# Regenera tools/tcu-toolbox/plantas.json cada vez que cambia el config de
# plantas del SCADA, para que la carpeta de la toolbox que se baja al portatil
# de campo lleve siempre las plantas al dia. La fuente de verdad es
# config/plants.yml (clave "gateways" de cada NCU).
name: Regenerar plantas.json de TCU Toolbox

on:
  push:
    branches: [main]
    paths:
      - "config/plants.yml"
      - "tools/tcu-toolbox/make_plantas.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyYAML
        run: pip install pyyaml

      - name: Regenerar JSON de la planta
        working-directory: tools/tcu-toolbox
        run: python make_plantas.py

      - name: Commit si hay cambios
        run: |
          git add tools/tcu-toolbox/plantas
          if git diff --cached --quiet; then
            echo "plantas/ ya estaba al dia"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "plantas/: JSON de planta regenerado desde config/plants.yml"
          git push
