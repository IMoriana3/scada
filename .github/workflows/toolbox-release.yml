# Publica cada version de la TCU Toolbox como Release de GitHub con un ZIP
# que lleva la version en el nombre (TCU_Toolbox_v2.4.zip). Asi la descarga
# de campo dice siempre que version es, sin abrir la herramienta.
name: Release de TCU Toolbox

on:
  push:
    branches: [main]
    paths:
      - "tools/tcu-toolbox/**"
      - "tools/tcu-agente/**"
  workflow_dispatch:

permissions:
  contents: write

# Cada version empuja un run, y con la cola de runners llena se apilaban:
# cuatro esperando y los de en medio cancelados por tiempo, asi que la Release
# se quedo en la v10.1 con la v10.6 ya en main. Solo importa la ultima version,
# asi que un run nuevo cancela al anterior en vez de ponerse detras.
concurrency:
  group: toolbox-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer version y empaquetar ZIP
        id: v
        run: |
          VER=$(grep -oP "VERSION_TOOLBOX = '\K[0-9.]+" tools/tcu-toolbox/TCU_Toolbox.ps1)
          test -n "$VER"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          cd tools
          zip -r "../TCU_Toolbox_v${VER}.zip" tcu-toolbox -x "tcu-toolbox/logs/*" "tcu-toolbox/backups/*" "tcu-toolbox/informes/*" "tcu-toolbox/config_local.json" "tcu-toolbox/tests/*"
          VAG=$(grep -oP "VERSION_AGENTE = '\K[0-9.]+" tcu-agente/TCU_Agente.ps1)
          zip -r "../TCU_Agente_v${VAG}.zip" tcu-agente -x "tcu-agente/agente_config.json" "tcu-agente/*.log"
          cd ..
          unzip -l "TCU_Toolbox_v${VER}.zip"

      # Las fichas son un extra: si fallan, la Release con el ZIP tiene que salir
      # igual. Antes un fallo aqui dejaba la version sin publicar.
      - name: Generar fichas de Seguimiento PEM (una por planta)
        continue-on-error: true
        run: |
          pip install --quiet openpyxl
          mkdir -p fichas
          cd fichas
          for f in ../tools/tcu-toolbox/plantas/*.json; do
            python ../tools/tcu-toolbox/make_seguimiento.py "$f"
          done
          ls -l

      - name: Crear o actualizar la release
        run: |
          VER="${{ steps.v.outputs.ver }}"
          TAG="toolbox-v${VER}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "TCU Toolbox v${VER}" \
              --notes "Herramienta offline de campo (configuracion y diagnostico de TCUs Sunner). Descarga el ZIP, copia la carpeta tcu-toolbox al portatil (las plantas van dentro, en plantas/) y doble clic en TCU_Toolbox.bat. Las fichas Seguimiento_PEM_*.xlsx (una por planta) se generan solas desde la topologia." \
              --latest
          fi
          # las fichas pueden no estar (el paso de arriba no corta la release)
          gh release upload "$TAG" "TCU_Toolbox_v${VER}.zip" TCU_Agente_v*.zip --clobber
          if compgen -G "fichas/Seguimiento_PEM_*.xlsx" > /dev/null; then
            gh release upload "$TAG" fichas/Seguimiento_PEM_*.xlsx --clobber
          fi
