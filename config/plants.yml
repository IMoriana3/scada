# Configuración de plantas y NCUs
# El collector lanza una tarea async por NCU.

plant:
  id: "elburgo"              # cambia a "ayora_24025", "san_jose_24019", etc.
  name: "El Burgo I"

polling:
  interval_s: 30             # ciclo completo de lectura por NCU
  meteo_interval_s: 10       # HSU/RSU (viento manda en seguridad, conviene más rápido)
  ncu_interval_s: 30
  modbus_timeout_s: 3
  modbus_retries: 2
  max_regs_per_read: 110     # 5 TCUs x 22 regs (límite Modbus: 125)

driver: "simulated"          # "simulated" | "modbus"

# Orden de palabras para F32 (verificar con firmware Factiun):
# "big"    -> registro N = palabra alta (big-endian word order, lo más común)
# "little" -> registro N = palabra baja
float_word_order: "big"

# UNA HSU POR GATEWAY, y su esclavo lo dice el gateway: 230 en el GW1 y 231 en
# el GW2 de cada NCU. Estaba declarado corto —1 en la NCU1 y 0 en la NCU2— y con
# eso el colector leía UNA de las cuatro: `hsu_count` es cuántos huecos de la
# caché de la NCU se leen (modbus_ncu.read_meteo), así que van 2 por NCU.
# Se comprueba en campo: el registro real de la malla es del NCU1-GW2 —sus 52
# TCU son los esclavos 57..108, exacto— y su único nodo meteo es HSU_V020_231.
ncus:
  - id: "NCU1"
    host: "10.100.1.52"
    port: 502
    unit_id: 1
    tcu_count: 108           # TCUs reales configurados en esta NCU (1..200)
    hsu_count: 2             # una por gateway
    hsu_extended: false      # true si la HSU expone el bloque 28000 (piranómetros)
    # hsu_ext_count: 1        # las N primeras HSU exponen ADEMAS su mapa
    #                         # AMPLIADO (28000): se lee y se FUNDE en la misma
    #                         # estacion (no es otra HSU: cobertura-zigbee#590).
    #                         # Incompatible con hsu_extended:true (seria leer
    #                         # la hoja dos veces).
    # Passthrough Modbus de la NCU hacia los TCU (unit id = nº de TCU), un
    # puerto por gateway Zigbee. Lo usa tools/tcu-toolbox/make_plantas.py
    # para generar plantas.json; el collector lo ignora. `hsu_esclavo` es el
    # unit id de la estación de ESE gateway, para la toolbox.
    # `ip_gw` es la IP del PROPIO Digi (el gateway es otro aparato, con su IP),
    # NUNCA la de la NCU. En El Burgo va por la regla NCU+n: NCU1 en .52 tiene
    # los Digi en .53 (GW1) y .54 (GW2); los dos contestaron por RCI el
    # 16/09/2026 (CPU 19 % y 16 %, 16 MB). El .54 es el que escanea a diario el
    # recolector de cobertura.
    gateways:
      - { puerto: 503, tcu_ini: 1,  tcu_fin: 56,  hsu_esclavo: 230, ip_gw: "10.100.1.53" }
      - { puerto: 504, tcu_ini: 57, tcu_fin: 108, hsu_esclavo: 231, ip_gw: "10.100.1.54" }
  - id: "NCU2"
    host: "10.100.1.56"
    port: 502
    unit_id: 1
    tcu_count: 107
    hsu_count: 2
    hsu_extended: false
    # NCU2 en .56: Digi en .57 y .58 por la misma regla (cobertura-zigbee la da
    # por confirmada en El Burgo), pero estos dos NO se han preguntado aun por RCI.
    gateways:
      - { puerto: 503, tcu_ini: 1,  tcu_fin: 45,  hsu_esclavo: 230, ip_gw: "10.100.1.57" }
      - { puerto: 504, tcu_ini: 46, tcu_fin: 107, hsu_esclavo: 231, ip_gw: "10.100.1.58" }
      # TCU 109 suelta en GW2 (rangos sacados de los .bat de Sunner; la 108
      # no existe). Confirmar en campo. Va sin hsu_esclavo: la estación del
      # GW2 ya está declarada arriba, en la fila del rango bueno.
      # `fuera_de_dwg` lo dice como DATO y no solo en este comentario: el careo
      # contra el layout (tools/test_plants_yml.py) lo informa en vez de darlo
      # por divergencia, porque es un hecho conocido y no un despiste.
      - { puerto: 504, tcu_ini: 109, tcu_fin: 109, fuera_de_dwg: [109], ip_gw: "10.100.1.58" }

# Medidor de tráfico: el colector cuenta los bytes de cada ciclo (Modbus contra
# la NCU y subida a InfluxDB) y los publica en la serie `traffic`. Cuesta un
# punto por NCU y ciclo (~250 B), y es lo que responde GET /traffic.
# Para estimarlo SIN arrancar nada: python tools/trafico.py
traffic:
  enabled: true

influxdb:
  url: "http://influxdb:8086"
  org: "factiun"
  bucket: "trackers"
  # token vía variable de entorno INFLUXDB_TOKEN
